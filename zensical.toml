[project]
site_name = "Ascendio RP"
site_description = "Regras, guias e lore da Ascendio RP."
site_url = "https://ascendiorp.pages.dev/"
site_author = "Ascendio RP"
docs_dir = "docs"
site_dir = "site"
copyright = "Ascendio RP — Sua história é apenas o começo."
extra_css = ["stylesheets/extra.css"]

# Navegação automática: novas páginas criadas no Pages CMS aparecem na wiki.
# Ao definir o domínio público, adicionar site_url para ativar navegação instantânea.

[project.theme]
language = "pt-BR"
logo = "assets/logo-dark.png"
favicon = "assets/favicon.ico"
features = ["navigation.sections", "navigation.indexes", "navigation.top", "search.suggest", "search.highlight", "content.code.copy"]
# Temas claro e escuro com escolha manual no cabeçalho.
# Primeira visita: respeita a preferência do sistema.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Alternar para modo escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "green"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Alternar para modo claro"


media:
  input: docs/assets
  output: /assets

content:
  - name: homepage
    label: Página inicial
    type: file
    path: docs/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Título
        type: string
      - name: body
        label: Conteúdo
        type: rich-text

  - name: primeiros-passos
    label: Primeiros Passos
    type: collection
    path: docs/primeiros-passos
    format: yaml-frontmatter
    fields:
      - name: title
        label: Título
        type: string
      - name: body
        label: Conteúdo
        type: rich-text

  - name: regras
    label: Regras
    type: collection
    path: docs/regras
    format: yaml-frontmatter
    fields:
      - name: title
        label: Título
        type: string
      - name: body
        label: Conteúdo
        type: rich-text